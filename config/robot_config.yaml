# Franka机器人配置
robot:
  # 机器人IP地址
  ip: "192.168.1.2"
  port: 4242

  # 控制参数
  frequency: 1000 # 控制频率 (Hz)
  Kx_scale: 1.0 # 位置增益缩放
  Kxd_scale: 1.0 # 速度增益缩放

  # 初始化参数
  joints_init: null # 初始关节位置，null表示不初始化
  joints_init_duration: 5.0 # 初始化持续时间

  # 实时控制
  soft_real_time: false # 是否启用软实时

  # 调试
  verbose: false

# Gripper配置
gripper:
  # Gripper IP地址 (连接到同一个Franka服务器)
  hostname: "192.168.1.2"
  port: 4242

  # 控制参数
  frequency: 30 # 控制频率 (Hz)
  move_max_speed: 200.0 # 最大移动速度

  # Grasp 相关参数 (新增)
  use_grasp_for_closing: true  # 闭合时是否使用grasp而非move
  grasp_threshold: 0.005       # 5mm，闭合超过此阈值时触发grasp
  grasp_speed: 0.03            # grasp速度 (m/s) - 稍慢一点让接触更稳定
  grasp_force: 55.0            # grasp力 (N) - 增大到40N防止物体掉落
  grasp_epsilon_inner: 0.003   # grasp内侧容差 (m)，5mm
  grasp_epsilon_outer: 0.003   # grasp外侧容差 (m)，5mm

  # 调试
  verbose: true  # 建议开启以观察grasp/move切换

# 共享内存配置
shared_memory:
  get_max_k: 5000 # 最大获取数据量
  get_time_budget: 0.2 # 获取时间预算
  put_desired_frequency: 1000 # 期望写入频率

# 策略接口配置
policy:
  # 动作维度 (7个关节角度)
  action_dim: 7

  # 观测维度
  obs_dim: 14 # 关节位置7 + 关节速度7

  # 控制延迟补偿
  action_latency: 0.15 # 动作延迟 (秒)
  obs_latency: 0.0001 # 观测延迟 (秒)
  frequency: 10.0 # 策略频率 (Hz)
